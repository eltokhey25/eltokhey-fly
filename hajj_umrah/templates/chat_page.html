{% load static %}<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0f766e">
  <title>مساعد الطوخي الذكي | الطوخي للحج والعمرة</title>
  <meta name="description" content="اسأل مساعد الطوخي الذكي عن رحلات الحج والعمرة والأسعار والمواعيد، واحجز مباشرة على مدار الساعة.">
  <link rel="canonical" href="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">
  <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}?v=3">
  <link rel="stylesheet" href="{% static 'css/chatbot.css' %}?v=2">
</head>
<body class="chat-page-body">
<div class="chat-page">

  <header class="chat-page__bar">
    <a class="chat-page__back" href="{% url 'core:home' %}" data-chat-back aria-label="رجوع للصفحة السابقة">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </a>
    <div class="chat-page__id">
      <h1 class="chat-page__title">مساعد الطوخي الذكي</h1>
      <p class="chat-page__sub">
        <span class="chat-page__status" aria-hidden="true"></span> متاح 24/7 — رد فوري
      </p>
    </div>
    <span class="chat-page__avatar" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" focusable="false">
        <rect x="3.5" y="7.5" width="17" height="12" rx="4"/>
        <path d="M12 7.5V4.6"/>
        <circle cx="12" cy="3.2" r="1.3" fill="currentColor" stroke="none"/>
        <path d="M9.4 12.4v1.7M14.6 12.4v1.7"/>
        <path d="M1.8 13h2.2M22.2 13H20"/>
      </svg>
    </span>
  </header>

  {% include 'chatbot/thread.html' %}

</div>
<script src="{% static 'js/chatbot.js' %}?v=2"></script>
</body>
</html>
